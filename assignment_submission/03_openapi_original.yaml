openapi: 3.0.3
info:
  title: Kaveri Stays API
  version: 1.0.0
  description: Hand-written Stage 3 original API design. Keep this file unchanged after the reveal.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: properties
  - name: room-types
  - name: rooms
  - name: availability
  - name: bookings
  - name: payments
  - name: reviews
  - name: reports
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a guest account
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}
      responses:
        '201': {description: Guest account created, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200': {description: Tokens issued, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '200': {description: New tokens, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '200': {description: Logged out, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/me:
    get:
      tags: [auth]
      summary: Get the caller's own record
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /properties:
    get:
      tags: [properties]
      summary: List properties
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Property list, content: {application/json: {schema: {$ref: '#/components/schemas/PropertyList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PropertyInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Property'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /properties/{property_id}:
    parameters: [{$ref: '#/components/parameters/PropertyId'}]
    get:
      tags: [properties]
      summary: Get a property
      responses:
        '200': {description: Property, content: {application/json: {schema: {$ref: '#/components/schemas/Property'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [properties]
      summary: Update a property
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PropertyInput'}}}
      responses:
        '200': {description: Updated property, content: {application/json: {schema: {$ref: '#/components/schemas/Property'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [properties]
      summary: Delete a property
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /room-types:
    get:
      tags: [room-types]
      summary: List room types
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Room type list, content: {application/json: {schema: {$ref: '#/components/schemas/RoomTypeList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [room-types]
      summary: Create a room type
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomTypeInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RoomType'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /room-types/{room_type_id}:
    parameters: [{$ref: '#/components/parameters/RoomTypeId'}]
    get:
      tags: [room-types]
      summary: Get a room type
      responses:
        '200': {description: Room type, content: {application/json: {schema: {$ref: '#/components/schemas/RoomType'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [room-types]
      summary: Update a room type
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomTypeInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/RoomType'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [room-types]
      summary: Delete a room type
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /rooms:
    get:
      tags: [rooms]
      summary: List rooms
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: property_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: room_type_id, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Room list, content: {application/json: {schema: {$ref: '#/components/schemas/RoomList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [rooms]
      summary: Create a room
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /rooms/{room_id}:
    parameters: [{$ref: '#/components/parameters/RoomId'}]
    get:
      tags: [rooms]
      summary: Get a room
      responses:
        '200': {description: Room, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [rooms]
      summary: Update a room
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Room'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [rooms]
      summary: Delete a room
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /availability:
    get:
      tags: [availability]
      summary: Find rooms available for a date range
      description: A checkout on the requested check-in date does not block availability. Dates are [check_in, check_out).
      parameters:
        - {name: property_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: check_in, in: query, required: true, schema: {type: string, format: date}}
        - {name: check_out, in: query, required: true, schema: {type: string, format: date}}
        - {name: room_type_id, in: query, schema: {type: integer, minimum: 1}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Available rooms, content: {application/json: {schema: {$ref: '#/components/schemas/RoomList'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /bookings:
    get:
      tags: [bookings]
      summary: List bookings in the caller's scope
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: property_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: status, in: query, schema: {type: string, enum: [confirmed, checked_in, checked_out, cancelled, no_show]}}
        - {name: check_in_from, in: query, schema: {type: string, format: date}}
        - {name: check_in_to, in: query, schema: {type: string, format: date}}
        - {name: guest_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [booking_id, check_in, check_out, status], default: booking_id}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        '200': {description: Booking list, content: {application/json: {schema: {$ref: '#/components/schemas/BookingList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [bookings]
      summary: Create booking and deposit atomically
      description: Nightly rate is looked up server-side. Booking insert and deposit payment commit or roll back together.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BookingCreate'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Room conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /bookings/{booking_id}:
    parameters: [{$ref: '#/components/parameters/BookingId'}]
    get:
      tags: [bookings]
      summary: Get one booking
      responses:
        '200': {description: Booking, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [bookings]
      summary: Change booking status
      description: Legal transitions are confirmed->checked_in->checked_out, confirmed->cancelled, and confirmed->no_show. Role and ownership are enforced.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BookingStatus'}}}
      responses:
        '200': {description: Updated booking, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /bookings/{booking_id}/payments:
    parameters: [{$ref: '#/components/parameters/BookingId'}]
    get:
      tags: [payments]
      summary: List payments for a booking
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Payment list, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [payments]
      summary: Record an instalment payment
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PaymentInput'}}}
      responses:
        '201': {description: Payment recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '200': {description: Existing payment returned for a repeated idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /payments:
    get:
      tags: [payments]
      summary: List payments in the caller's scope
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Payment list, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /payments/{payment_id}:
    parameters: [{$ref: '#/components/parameters/PaymentId'}]
    get:
      tags: [payments]
      summary: Get one payment
      responses:
        '200': {description: Payment, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reviews:
    get:
      tags: [reviews]
      summary: List reviews
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: property_id, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Review list, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [reviews]
      summary: Review a checked-out booking once
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReviewInput'}}}
      responses:
        '201': {description: Review created, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /reviews/property/{property_id}:
    parameters: [{$ref: '#/components/parameters/PropertyId'}]
    get:
      tags: [reviews]
      summary: List reviews for one property
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Review list, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reports/properties/{property_id}/occupancy:
    parameters: [{$ref: '#/components/parameters/PropertyId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
    get:
      tags: [reports]
      summary: Occupancy report
      responses:
        '200': {description: Occupancy report, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /reports/properties/{property_id}/adr:
    parameters: [{$ref: '#/components/parameters/PropertyId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
    get:
      tags: [reports]
      summary: ADR report
      responses:
        '200': {description: ADR report, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /reports/properties/{property_id}/revpar:
    parameters: [{$ref: '#/components/parameters/PropertyId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
    get:
      tags: [reports]
      summary: RevPAR report
      responses:
        '200': {description: RevPAR report, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    PropertyId: {name: property_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    RoomTypeId: {name: room_type_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    RoomId: {name: room_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    BookingId: {name: booking_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    PaymentId: {name: payment_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    From: {name: from, in: query, required: true, schema: {type: string, format: date}}
    To: {name: to, in: query, required: true, schema: {type: string, format: date}}
  responses:
    BadRequest: {description: Bad request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Missing or invalid authentication, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Authenticated but not permitted, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found or outside object scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Current-state or constraint conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Validation failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited: {description: Too many login attempts, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
    Message:
      type: object
      properties: {message: {type: string}}
    RegisterRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, writeOnly: true}
        name: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, writeOnly: true}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string, writeOnly: true}}
    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token: {type: string}
        refresh_token: {type: string, writeOnly: true}
        token_type: {type: string, example: bearer}
    Me:
      type: object
      required: [account_id, email, role]
      properties:
        account_id: {type: integer}
        email: {type: string, format: email}
        role: {type: string, enum: [guest, staff, manager, owner]}
        guest_id: {type: integer, nullable: true}
        property_id: {type: integer, nullable: true}
    Property:
      type: object
      required: [property_id, name]
      properties:
        property_id: {type: integer}
        name: {type: string}
        address: {type: string, nullable: true}
    PropertyInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
        address: {type: string}
    RoomType:
      type: object
      required: [room_type_id, name, max_occupancy, price_per_night]
      properties:
        room_type_id: {type: integer}
        name: {type: string}
        max_occupancy: {type: integer, minimum: 1}
        price_per_night: {type: number}
    RoomTypeInput:
      type: object
      required: [name, max_occupancy, price_per_night]
      properties:
        name: {type: string}
        max_occupancy: {type: integer, minimum: 1}
        price_per_night: {type: number, minimum: 0}
    Room:
      type: object
      required: [room_id, room_number, property_id, room_type_id]
      properties:
        room_id: {type: integer}
        room_number: {type: string}
        property_id: {type: integer}
        room_type_id: {type: integer}
    RoomInput:
      type: object
      required: [room_number, property_id, room_type_id]
      properties:
        room_number: {type: string}
        property_id: {type: integer, minimum: 1}
        room_type_id: {type: integer, minimum: 1}
    BookingCreate:
      type: object
      required: [room_id, check_in, check_out, guest_count, payment_method]
      properties:
        room_id: {type: integer, minimum: 1}
        check_in: {type: string, format: date}
        check_out: {type: string, format: date}
        guest_count: {type: integer, minimum: 1}
        payment_method: {type: string, enum: [cash, card, upi]}
    Booking:
      type: object
      properties:
        booking_id: {type: integer}
        guest_id: {type: integer}
        room_id: {type: integer}
        check_in: {type: string, format: date}
        check_out: {type: string, format: date}
        guest_count: {type: integer}
        status: {type: string, enum: [confirmed, checked_in, checked_out, cancelled, no_show]}
        nights: {type: integer}
        price_per_night: {type: number}
        total_amount: {type: number}
        amount_paid: {type: number}
        payment_methods: {type: array, items: {type: string}}
    BookingStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [checked_in, checked_out, cancelled, no_show]}
    PaymentInput:
      type: object
      required: [amount, method]
      properties:
        amount: {type: number, exclusiveMinimum: 0}
        method: {type: string, enum: [cash, card, upi]}
    Payment:
      type: object
      properties:
        payment_id: {type: integer}
        booking_id: {type: integer}
        amount: {type: number}
