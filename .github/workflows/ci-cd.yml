name: Kaveri CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..
          mkdir -p backend/dist backend/api/dist
          cp -r frontend/dist/* backend/dist/ || true
          cp -r frontend/dist/* backend/api/dist/ || true

      - name: Verify Backend Routes & Health Check
        run: |
          python -c "import os, sys; sys.path.insert(0, 'backend'); sys.path.insert(0, 'backend/apps'); os.environ['DJANGO_SETTINGS_MODULE']='config.settings'; from fastapi.testclient import TestClient; from api.main import app; c = TestClient(app); assert c.get('/health').status_code == 200; assert c.get('/properties').status_code == 200; assert c.get('/rooms/availability').status_code == 200; print('All CI health checks passed successfully!')"

      - name: Trigger Render Deploy Webhook (if secret configured)
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
